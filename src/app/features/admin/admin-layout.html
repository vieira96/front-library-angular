<div class="min-h-screen bg-slate-50">
  <app-header [title]="'Administração'"></app-header>

  @if (isMenuOpen()) {
    <div class="fixed inset-0 z-50 lg:hidden">
      <button
        type="button"
        aria-label="Fechar menu"
        class="absolute inset-0 bg-slate-950/40 backdrop-blur-sm"
        (click)="closeMenu()"
      ></button>

      <aside
        role="dialog"
        aria-modal="true"
        aria-label="Menu de administração"
        class="relative flex h-full w-[min(19rem,calc(100vw-3rem))] flex-col bg-white p-4 shadow-2xl"
      >
        <div class="mb-6 flex items-center justify-between px-2">
          <div>
            <p class="text-xs font-semibold uppercase tracking-[0.16em] text-indigo-600">Library APP</p>
            <h2 class="mt-1 text-lg font-bold text-slate-900">Administração</h2>
          </div>
          <button
            type="button"
            aria-label="Fechar menu"
            class="rounded-lg p-2 text-slate-500 transition hover:bg-slate-100 hover:text-slate-900"
            (click)="closeMenu()"
          >
            <svg lucideX class="h-5 w-5"></svg>
          </button>
        </div>

        <nav class="space-y-1">
          <a
            routerLink="/admin"
            routerLinkActive="bg-indigo-50 text-indigo-700"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()"
            class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
          >
            <svg lucideLayoutDashboard class="h-5 w-5"></svg>
            Dashboard
          </a>
          <a
            routerLink="/admin/authors"
            routerLinkActive="bg-indigo-50 text-indigo-700"
            (click)="closeMenu()"
            class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
          >
            <svg lucideUsers class="h-5 w-5"></svg>
            Autores
          </a>
          <a
            routerLink="/admin/books"
            routerLinkActive="bg-indigo-50 text-indigo-700"
            (click)="closeMenu()"
            class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
          >
            <svg lucideBookOpen class="h-5 w-5"></svg>
            Livros
          </a>
        </nav>
      </aside>
    </div>
  }

  <aside class="fixed inset-y-16 left-0 z-30 hidden w-64 border-r border-slate-200 bg-white lg:block">
    <nav class="h-full overflow-y-auto px-4 py-6">
      <div class="space-y-1">
        <a
          routerLink="/admin"
          routerLinkActive="bg-indigo-50 text-indigo-700"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
        >
          <svg lucideLayoutDashboard class="h-5 w-5"></svg>
          Dashboard
        </a>
        <a
          routerLink="/admin/authors"
          routerLinkActive="bg-indigo-50 text-indigo-700"
          class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
        >
          <svg lucideUsers class="h-5 w-5"></svg>
          Autores
        </a>
        <a
          routerLink="/admin/books"
          routerLinkActive="bg-indigo-50 text-indigo-700"
          class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
        >
          <svg lucideBookOpen class="h-5 w-5"></svg>
          Livros
        </a>
      </div>
    </nav>
  </aside>

  <div class="lg:pl-64">
    <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8 lg:py-8">
      <div class="mb-6 flex items-center lg:hidden">
        <button
          type="button"
          aria-label="Abrir menu de administração"
          [attr.aria-expanded]="isMenuOpen()"
          class="inline-flex h-11 w-11 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-700 shadow-sm transition hover:border-indigo-200 hover:bg-indigo-50 hover:text-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 mr-4"
          (click)="openMenu()"
        >
          <svg lucideMenu class="h-5 w-5"></svg>
        </button>

        <div>
          <p class="text-xs font-semibold uppercase tracking-[0.16em] text-indigo-600">Library APP</p>
          <h2 class="mt-1 text-lg font-bold text-slate-900">Administração</h2>
        </div>
      </div>

      <main class="min-w-0">
        <router-outlet />
      </main>
    </div>
  </div>
</div>
