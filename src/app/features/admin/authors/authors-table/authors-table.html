<div class="overflow-x-auto rounded-lg bg-white shadow-sm ring-1 ring-gray-200">
  <table class="min-w-[800px] w-full table-fixed divide-y divide-gray-200">
    <colgroup>
      <col />
      <col />
      <col />
      <col />
      <col />
    </colgroup>
    <thead class="bg-gray-50">
      <tr>
        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">
          Nome
        </th>
        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">
          Nacionalidade
        </th>
        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">
          Data de Nascimento
        </th>
        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">
          Livros
        </th>
        <th scope="col" class="relative px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">
          <span class="sr-only">Ações</span>
        </th>
      </tr>
    </thead>
    <tbody class="divide-y divide-gray-200 bg-white">
      @for (author of authors(); track author.id) {
        <tr class="hover:bg-gray-50">
          <td class="break-all px-6 py-4 text-sm font-medium text-gray-900">
            {{ author.name }}
          </td>
          <td class="break-words px-6 py-4 text-sm text-gray-600">
            {{ author.nationality }}
          </td>
          <td class="px-6 py-4 text-sm text-gray-600">
            {{ author.birthdate | date:'dd/MM/yyyy' }}
          </td>
          <td class="whitespace-nowrap px-6 py-4 text-sm text-gray-600">
            {{ author.bookCount ?? 0 }}
          </td>
          <td class="relative whitespace-nowrap px-6 py-4 text-right text-sm font-medium">
            <div class="flex items-center justify-end gap-1">
              <button
                type="button"
                [attr.data-testid]="'edit-author-' + author.id"
                class="cursor-pointer rounded-lg p-2 text-indigo-600 hover:bg-indigo-50 hover:text-indigo-700"
                (click)="edit.emit(author)"
              >
                <svg lucidePencil class="h-5 w-5"></svg>
              </button>
              <app-tooltip
                text="Não é possível excluir este autor pois ele possui livros cadastrados."
                position="left"
                [enabled]="(author.bookCount ?? 0) > 0"
              >
                <button
                  type="button"
                  [attr.data-testid]="'delete-author-' + author.id"
                  [disabled]="(author.bookCount ?? 0) > 0"
                  [class]="(author.bookCount ?? 0) > 0
                    ? 'pointer-events-none cursor-not-allowed rounded-lg p-2 text-gray-300'
                    : 'cursor-pointer rounded-lg p-2 text-red-600 hover:bg-red-50 hover:text-red-700'"
                  (click)="openDeleteModal(author)"
                >
                  <svg lucideTrash class="h-5 w-5"></svg>
                </button>
              </app-tooltip>
            </div>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

@if (showDeleteModal()) {
  <app-delete-author-modal
    [author]="authorToDelete()!"
    (success)="onDeleteSuccess()"
    (cancel)="closeDeleteModal()"
  ></app-delete-author-modal>
}
