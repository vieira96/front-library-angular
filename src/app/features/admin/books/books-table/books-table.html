<div class="overflow-x-auto rounded-lg bg-white shadow-sm ring-1 ring-gray-200">
  <table class="min-w-[800px] w-full table-fixed divide-y divide-gray-200">
    <colgroup>
      <col />
      <col />
      <col />
      <col />
      <col />
      <col class="w-32" />
    </colgroup>
    <thead class="bg-gray-50">
      <tr>
        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">
          Título
        </th>
        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">
          ISBN
        </th>
        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">
          Autor
        </th>
        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">
          Data de Publicação
        </th>
        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">
          Preço
        </th>
        <th scope="col" class="relative w-32 px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-gray-500">
          <span class="sr-only">Ações</span>
        </th>
      </tr>
    </thead>
    <tbody class="divide-y divide-gray-200 bg-white">
      @for (book of books(); track book.id) {
        <tr class="hover:bg-gray-50">
          <td class="break-words px-6 py-4 text-sm font-medium text-gray-900">
            {{ book.title }}
          </td>
          <td class="break-all px-6 py-4 text-sm text-gray-600">
            {{ book.isbn }}
          </td>
          <td class="break-words px-6 py-4 text-sm text-gray-600">
            {{ book.author.name }}
          </td>
          <td class="px-6 py-4 text-sm text-gray-600">
            {{ book.publishDate | date:'dd/MM/yyyy' }}
          </td>
          <td class="whitespace-nowrap px-6 py-4 text-sm text-gray-600">
            {{ book.price | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}
          </td>
          <td class="relative whitespace-nowrap px-6 py-4 text-right text-sm font-medium">
            <div class="flex items-center justify-end gap-1">
              <button
                type="button"
                disabled
                aria-label="Editar livro (indisponível)"
                class="cursor-not-allowed rounded-lg p-2 text-gray-300"
              >
                <svg lucidePencil class="h-5 w-5"></svg>
              </button>
              <button
                type="button"
                disabled
                aria-label="Excluir livro (indisponível)"
                class="cursor-not-allowed rounded-lg p-2 text-gray-300"
              >
                <svg lucideTrash class="h-5 w-5"></svg>
              </button>
            </div>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
