<div class="fixed inset-0 z-50 flex items-center justify-center">
  <div class="fixed inset-0 bg-black/50" (click)="cancel.emit()"></div>
  <div class="relative mx-4 w-full max-w-md rounded-lg bg-white p-6 shadow-xl">
    <h3 class="text-lg font-semibold text-gray-900">
      Confirmar exclusão
    </h3>
    <p class="mt-2 text-sm text-gray-600">
      Tem certeza que deseja excluir o livro <strong>{{ book().title }}</strong>?
    </p>
    @if (errorMessage()) {
      <p class="mt-2 rounded-md bg-red-50 p-3 text-sm text-red-800">
        {{ errorMessage() }}
      </p>
    }
    <div class="mt-6 flex justify-end gap-3">
      <button
        type="button"
        data-testid="cancel-delete-book"
        [disabled]="isLoading()"
        class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-50"
        (click)="cancel.emit()"
      >
        Cancelar
      </button>
      <button
        type="button"
        data-testid="confirm-delete-book"
        [disabled]="isLoading()"
        class="rounded-lg bg-red-600 px-4 py-2 text-sm font-semibold text-white hover:bg-red-500 disabled:cursor-not-allowed disabled:opacity-50"
        (click)="confirm()"
      >
        @if (isLoading()) {
          Excluindo...
        } @else {
          Excluir
        }
      </button>
    </div>
  </div>
</div>
