<div class="relative" (click)="$event.stopPropagation()">
  <button
    type="button"
    aria-label="Configurações de notificações"
    title="Configurações de notificações"
    (click)="toggle()"
    class="inline-flex h-11 w-11 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-600 shadow-sm transition hover:border-indigo-200 hover:bg-indigo-50 hover:text-indigo-700"
  >
    <svg lucideSettings class="h-5 w-5"></svg>
  </button>

  @if (isOpen()) {
    <div class="absolute right-0 z-50 mt-2 w-72 overflow-hidden rounded-lg bg-white shadow-lg ring-1 ring-gray-200">
      <div class="border-b border-gray-100 px-4 py-3">
        <h3 class="text-sm font-semibold text-gray-900">Preferências</h3>
      </div>

      @if (updateError()) {
        <div class="border-b border-gray-100 px-4 py-3">
          <app-toast
            [message]="updateError()!"
            type="error"
            (dismissed)="updateError.set(null)"
          />
        </div>
      }

      <div class="px-4 py-3">
        <div class="flex items-center justify-between gap-3">
          <div class="min-w-0">
            <p class="text-sm font-medium text-gray-900">Notificações APP</p>
            <p class="truncate text-xs text-gray-500">Notificações em tempo real.</p>
          </div>
          <button
            type="button"
            role="switch"
            [attr.aria-checked]="appNotification()"
            [attr.aria-label]="'Notificações de livros novos'"
            (click)="appNotificationToggle()"
            [class]="appNotification() ? 'bg-indigo-600' : 'bg-slate-300'"
            class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
          >
            <span
              [class]="appNotification() ? 'translate-x-5' : 'translate-x-0'"
              class="pointer-events-none inline-block h-6 w-6 transform rounded-full bg-white shadow ring-1 ring-black/10 transition-transform"
            ></span>
          </button>
        </div>
      </div>
    </div>
  }
</div>
