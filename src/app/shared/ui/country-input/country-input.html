<div class="relative">
  @if (label()) {
    <label class="mb-1 block text-sm font-medium text-gray-700">
      {{ label() }}
      @if (required()) {
        <span class="text-red-500">*</span>
      }
    </label>
  }

  <div
    class="relative flex items-center rounded-lg border bg-white transition-colors"
    [class]="isOpen()
      ? 'border-indigo-500 ring-2 ring-indigo-500/20'
      : invalid()
        ? 'border-red-500 ring-2 ring-red-500/20'
        : 'border-gray-300 hover:border-gray-400'"
  >
    <div class="pointer-events-none pl-3">
      <svg lucideSearch class="h-4 w-4 text-gray-400"></svg>
    </div>

    <input
      type="text"
      [value]="searchQuery()"
      [placeholder]="placeholder()"
      class="block w-full border-0 bg-transparent px-3 py-2.5 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none"
      (input)="onInput($event)"
      (focus)="isOpen.set(filteredCountries().length > 0)"
    />

    @if (searchQuery()) {
      <button
        type="button"
        class="mr-1 rounded-full p-1 text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-600"
        (click)="onClear()"
      >
        <svg lucideX class="h-4 w-4"></svg>
      </button>
    }

    <button
      type="button"
      class="mr-2 rounded-full p-1 text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-600"
      (click)="toggleDropdown()"
    >
      <svg lucideChevronDown
        class="h-4 w-4 transition-transform"
        [class.rotate-180]="isOpen()"
      ></svg>
    </button>
  </div>

  @if (isOpen()) {
    <div class="absolute z-50 mt-1 w-full overflow-hidden rounded-lg border border-gray-200 bg-white shadow-lg">
      @if (isLoading()) {
        <div class="flex items-center justify-center px-4 py-3 text-sm text-gray-500">
          <svg class="mr-2 h-4 w-4 animate-spin text-indigo-500" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          Carregando países...
        </div>
      } @else if (filteredCountries().length > 0) {
        <ul class="max-h-60 overflow-auto py-1">
          @for (country of filteredCountries(); track country) {
            <li
              class="relative cursor-pointer select-none px-4 py-2 text-sm text-gray-900 transition-colors hover:bg-indigo-50 hover:text-indigo-600"
              [class.bg-indigo-50]="country === searchQuery()"
              [class.text-indigo-600]="country === searchQuery()"
              (click)="onSelectCountry(country)"
            >
              {{ country }}
            </li>
          }
        </ul>
      } @else {
        <div class="px-4 py-3 text-sm text-gray-500">
          Nenhum país encontrado
        </div>
      }
    </div>
  }
</div>
