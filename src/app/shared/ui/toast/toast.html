@if (visible()) {
  <div
    role="alert"
    class="absolute left-1/2 top-4 z-50 flex w-full max-w-2xl -translate-x-1/2 items-start gap-3 rounded-lg p-4 shadow-lg transition-all"
    [class]="type() === 'success'
      ? 'border-l-4 border-green-500 bg-green-50 text-green-800'
      : 'border-l-4 border-red-500 bg-red-50 text-red-800'"
    (mouseenter)="onMouseEnter()"
    (mouseleave)="onMouseLeave()"
  >
    @if (type() === 'success') {
      <svg lucideCircleCheck class="mt-0.5 h-5 w-5 shrink-0 text-green-500"></svg>
    } @else {
      <svg lucideCircleX class="mt-0.5 h-5 w-5 shrink-0 text-red-500"></svg>
    }
    <p class="flex-1 text-sm font-medium">{{ message() }}</p>
    <button
      type="button"
      class="shrink-0 rounded-md p-1 transition-colors"
      [class]="type() === 'success'
        ? 'hover:bg-green-100 text-green-500 hover:text-green-600'
        : 'hover:bg-red-100 text-red-500 hover:text-red-600'"
      (click)="close()"
    >
      <svg lucideX class="h-4 w-4"></svg>
    </button>
  </div>
}
